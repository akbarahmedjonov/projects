    <!-- task 12 -->

    <button id="boshla">Run</button>
    <h1 id="natija"></h1>

    <script>
      document.getElementById("boshla").addEventListener("click", () => {
        const n = Number(prompt("N: "));
        const natija = document.getElementById("natija");
        let total = 1;
        for (let i = 1.1; i < n + 1; i += 0.1) {
          total *= i;
        }
        natija.textContent = total;
      });
    </script>
